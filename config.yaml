# Runtime configuration for `orchestrate.py` / `src.pipeline`
#
# Per-agent Gemma (or other) model ids for `-m`. See agent_configs.md for the
# May 2026 catalog and tier rationale. Missing keys fall back to `model`.

model: gemma-4-26b-a4b-it

models:
  researcher: gemma-4-26b-a4b-it
  skeptic: gemma-4-e4b-it
  contrarian: gemma-4-26b-a4b-it
  reviewer: gemma-4-31b-it
  synthesizer: gemma-4-31b-it

timeouts:
  researcher: 180
  skeptic: 180
  contrarian: 180
  reviewer: 240
  synthesizer: 300
  default: 180

paths:
  prompts_dir: prompts

pipeline:
  disagreement_threshold: 3
  parallel_initial: false

# When true (or SHOW_AGENT_THINKING=1, or --show-thinking), write *_thinking.txt and include traces in report/transcript.
thinking:
  enabled: false

# --- Session reuse (read docs/SESSION_REUSE_USER_GUIDE.md first) ---
# Matching is lexical (wording), not "AI understanding." Use inject for safe defaults.
# max_reuse_session_age_days: omit or set a number (days). Use null only if you accept very old answers.
# allow_zero_call_reuse: must be true to allow mode short_circuit (copies old answer, no API calls).
session_reuse:
  enabled: false
  mode: inject
  similarity_threshold: 0.90
  min_word_overlap: 0.14
  max_reuse_session_age_days: 14
  max_prior_chars: 8000
  allow_zero_call_reuse: false

context:
  max_chars: 48000
