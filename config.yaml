# Runtime configuration for `orchestrate.py` / `src.pipeline`
#
# Per-agent model ids for `gemini -m`. Use ids from `gemini models list` for your
# auth (API key or Google account). Tier rationale: agent_configs.md (Gemini 2.5 / 3.x + Gemma).

# Default Gemini 3.x heterogeneous stack (preview ids — confirm with `gemini models list`).
# If any id 404s, fall back to gemini-2.5-flash for every role (see README troubleshooting).
model: gemini-3-flash-preview

models:
  researcher: gemini-3-flash-preview
  skeptic: gemini-3.1-flash-lite
  contrarian: gemini-3-flash-preview
  reviewer: gemini-3.1-pro-preview
  synthesizer: gemini-3.1-pro-preview

timeouts:
  researcher: 180
  skeptic: 180
  contrarian: 240
  reviewer: 240
  synthesizer: 300
  default: 180

paths:
  prompts_dir: prompts

pipeline:
  disagreement_threshold: 3
  parallel_initial: false

# When true (or SHOW_AGENT_THINKING=1, or --show-thinking), write *_thinking.txt and include traces in report/transcript.
# echo_terminal: print the same parsed thinking to stderr after each agent (useful with --no-dashboard or logging).
thinking:
  enabled: true
  echo_terminal: false

# --- Session reuse (read docs/SESSION_REUSE_USER_GUIDE.md first) ---
# Matching is lexical (wording), not "AI understanding." Use inject for safe defaults.
# max_reuse_session_age_days: omit or set a number (days). Use null only if you accept very old answers.
# allow_zero_call_reuse: must be true to allow mode short_circuit (copies old answer, no API calls).
session_reuse:
  enabled: false
  mode: inject
  similarity_threshold: 0.90
  min_word_overlap: 0.14
  max_reuse_session_age_days: 14
  max_prior_chars: 8000
  allow_zero_call_reuse: false

context:
  max_chars: 48000

# --- API / quota pacing (Gemini CLI subprocesses). Tunes burstiness and soft 429 handling.
# Defaults are conservative: small gaps between calls, no overlapping Researcher+Skeptic,
# exponential backoff retries when stderr looks like quota / rate limit / 429.
rate_limit:
  min_interval_s: 0.35
  max_concurrent: 1
  max_retries_on_rate_limit: 4
  retry_backoff_base_s: 5
  retry_backoff_max_s: 90

# --- Adaptive tier routing (see docs/ADAPTIVE_TIERS.md) ---
# When enabled is true and router is not off, classifies the question (T0 trivial add, T1 short path, T2 full).
# CLI --adaptive overrides router for this run; --adaptive off forces routing off.
# Note: contested questions (e.g. policy debates) usually classify as T2 — full heterogeneous stack below.
adaptive:
  enabled: true
  router: heuristic_then_slm
  router_model: gemini-3-flash-preview
  router_timeout: 30
  models_light:
    researcher: gemini-3-flash-preview
    synthesizer: gemini-3-flash-preview
  fallback_to_full: true
  max_trivial_add_digits: 6
  require_claims_for_t1_fallback: false
